# Apache Configuration for Coder at ROOT path
# This assumes Coder is running on localhost:7080
# Coder should be started with: --access-url https://wcoder.codecubicle.ch
# (NO /coder path in the access URL)
#
# IMPORTANT: After copying this config, make sure to:
# 1. Disable the default Apache site: sudo a2dissite 000-default
# 2. Enable this site: sudo a2ensite wcoder.codecubicle.ch
# 3. Ensure no DocumentRoot directive exists in this VirtualHost
# 4. Test config: sudo apache2ctl configtest
# 5. Reload Apache: sudo systemctl reload apache2

<VirtualHost *:443>
    ServerName wcoder.codecubicle.ch
    ServerAlias *.wcoder.codecubicle.ch
    
    # IMPORTANT: No DocumentRoot - we're only proxying to Coder
    # DocumentRoot /var/www/html  # DO NOT USE - comment out or remove
    
    ErrorLog ${APACHE_LOG_DIR}/coder-error.log
    CustomLog ${APACHE_LOG_DIR}/coder-access.log combined

    # Enable required modules
    ProxyPreserveHost On
    ProxyRequests Off
    
    # Proxy headers for proper WebSocket and API handling
    ProxyAddHeaders On
    
    # RewriteEngine must be enabled for WebSocket support
    RewriteEngine On
    
    # IMPORTANT: Handle WebSocket upgrades FIRST, before any ProxyPass
    # WebSocket support (REQUIRED for JetBrains Gateway and workspace connectivity)
    # Check for both Connection: Upgrade and Upgrade: websocket headers
    RewriteCond %{HTTP:Upgrade} =websocket [NC]
    RewriteCond %{HTTP:Connection} Upgrade [NC]
    RewriteRule ^/(.*) ws://127.0.0.1:7080/$1 [P,L]
    
    # Proxy ALL requests from root to Coder server
    # This proxies everything from / to http://127.0.0.1:7080/
    ProxyPass / http://127.0.0.1:7080/ upgrade=any
    ProxyPassReverse / http://127.0.0.1:7080/
    
    # SSL Configuration (adjust paths to your certificates)
    SSLEngine on
    SSLCertificateFile /etc/letsencrypt/live/wcoder.codecubicle.ch/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/wcoder.codecubicle.ch/privkey.pem
</VirtualHost>

# Redirect HTTP to HTTPS
<VirtualHost *:80>
    ServerName wcoder.codecubicle.ch
    ServerAlias *.wcoder.codecubicle.ch
    # Redirect to root path on HTTPS
    Redirect permanent / https://wcoder.codecubicle.ch/
</VirtualHost>
