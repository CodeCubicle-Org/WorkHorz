services:
  coder:
    # This configuration MUST be stable for our documentation and other automations.
    image: ghcr.io/coder/coder:${CODER_VERSION:-latest}
    ports:
      - "7080:7080"
    restart: always
    environment:
      # PostgreSQL connection string
      CODER_PG_CONNECTION_URL: postgresql://${POSTGRES_USER:-username}:${POSTGRES_PASSWORD:-password}@database/${POSTGRES_DB:-coder}?sslmode=disable
      
      # Coder HTTP address (inside container)
      CODER_HTTP_ADDRESS: "0.0.0.0:7080"
      
      # IMPORTANT: Access URL - changed from /coder to root since Apache serves at root
      # This needs to be an IP or domain reachable by workspaces, not localhost or 127.0.0.1 for non-Docker templates
      CODER_ACCESS_URL: "https://wcoder.codecubicle.ch"
      
      # IMPORTANT: Wildcard access URL for JetBrains Gateway support
      # This allows JetBrains Gateway to create subdomain connections for IDE backends
      CODER_WILDCARD_ACCESS_URL: "*.wcoder.codecubicle.ch"
    
    # Uncomment the following lines if the `coder` user in the container
    # does not have write permissions on the Docker socket.
    # You can find the group ID by running `getent group docker | cut -d: -f3`
    group_add:
      - "110" # docker group on host
    
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      # Uncomment the following to reset the dev tunnel URL:
      # - coder_coder_home:/home/coder
      # This volume is not required in production.
      coder_home:/home/coder
    
    depends_on:
      database:
        condition: service_healthy

  database:
    # The minimum supported PostgreSQL version is 13.
    # See https://hub.docker.com/_/postgres for more versions.
    image: "postgres:17"
    # Uncomment the following lines to allow external connections to the database:
    # ports:
    #   - "5432:5432"
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-username}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password}
      POSTGRES_DB: ${POSTGRES_DB:-coder}
    volumes:
      # Uncomment the following to reset Coder:
      # - coder_coder_data:/var/lib/postgresql/data
      coder_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-username} -d ${POSTGRES_DB:-coder}"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  coder_data:
  coder_home:

